<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Apk Store</title>
  <style>
    :root { --green:#01875f; --ink:#202124; --muted:#5f6368; --line:#e8eaed; --bg:#fff; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:Roboto, Arial, sans-serif; }
    body { min-height:100vh; display:flex; flex-direction:column; }
    header { background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
    .splash-screen { position:fixed; inset:0; z-index:9999; display:grid; place-items:center; background:#fff; opacity:1; visibility:visible; transition:opacity .45s ease, visibility .45s ease; }
    .splash-screen.is-hidden { opacity:0; visibility:hidden; pointer-events:none; }
    #splashAudio { display:none; }
    .splash-content { display:flex; flex-direction:column; align-items:center; gap:11px; padding:24px; text-align:center; }
    .splash-logo { width:74px; height:74px; display:grid; place-items:center; animation:splashPop .8s cubic-bezier(.2,.8,.2,1) both; }
    .splash-logo svg { width:58px; height:58px; filter:drop-shadow(0 5px 8px #01875f20); }
    .splash-wordmark { color:#3c4043; font-size:27px; font-weight:600; letter-spacing:-.7px; animation:splashRise .65s .12s ease-out both; }
    .splash-wordmark span { color:#01875f; }
    .splash-caption { margin-top:1px; color:#72777c; font-size:13px; letter-spacing:.15px; animation:splashRise .65s .2s ease-out both; }
    @keyframes splashPop { from { opacity:0; transform:scale(.72); } to { opacity:1; transform:scale(1); } }
    @keyframes splashRise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @media (prefers-reduced-motion:reduce) { .splash-screen,.splash-logo,.splash-wordmark,.splash-caption { animation:none; transition:none; } }
    .topbar { height:64px; display:flex; align-items:center; gap:14px; padding:0 20px; max-width:1100px; margin:auto; }
    .play-mark { width:28px; height:28px; display:grid; place-items:center; flex:none; }
    .play-mark svg { width:27px; height:27px; }
    .brand { font-size:20px; color:#5f6368; letter-spacing:-.4px; white-space:nowrap; }
    .brand b { font-weight:500; color:#3c4043; }
    .search { margin-left:auto; width:min(440px, 52vw); height:42px; border:0; border-radius:22px; background:#f1f3f4; display:flex; align-items:center; padding:0 16px; gap:10px; color:#5f6368; }
    .search svg { width:20px; height:20px; flex:none; }
    .search input { min-width:0; width:100%; background:transparent; border:0; outline:0; font:400 14px Roboto,Arial,sans-serif; color:var(--ink); }
    .avatar { width:34px; height:34px; border-radius:50%; object-fit:cover; object-position:center; border:1px solid #e1e7e4; display:block; flex:none; }
    .categories { max-width:1100px; margin:auto; height:51px; display:flex; align-items:stretch; gap:28px; padding:0 20px; overflow-x:auto; scrollbar-width:none; }
    .categories::-webkit-scrollbar { display:none; }
    .category { position:relative; display:flex; align-items:center; flex:none; border:0; padding:0 2px; background:none; color:#5f6368; font:500 14px Roboto,Arial,sans-serif; cursor:pointer; white-space:nowrap; }
    .category.active { color:var(--green); }
    .category.active::after { content:""; position:absolute; height:3px; border-radius:3px 3px 0 0; background:var(--green); left:0; right:0; bottom:0; }
    main { flex:1; min-height:calc(100vh - 180px); background:#fff; }
    .blank-area { max-width:1100px; margin:0 auto; padding:24px 20px; }
    .blank-area:focus { outline:none; }
    footer { border-top:1px solid var(--line); background:#fff; }
    .bottom-nav { height:66px; max-width:560px; margin:auto; display:flex; align-items:center; justify-content:space-around; padding:0 12px; }
    .nav-item { width:88px; height:54px; border:0; background:transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:#5f6368; font:500 11px Roboto,Arial,sans-serif; cursor:pointer; }
    .nav-item svg { width:22px; height:22px; }
    .nav-item.active { color:var(--green); }
    .nav-item.active .icon-pill { background:#dff3eb; border-radius:18px; width:58px; height:29px; display:grid; place-items:center; }
    .icon-pill { width:58px; height:29px; display:grid; place-items:center; }

    .promo-carousel { max-width:1060px; margin:24px auto 0; padding:0 20px; }
    .promo-frame { position:relative; overflow:hidden; border-radius:22px; min-height:270px; background:linear-gradient(110deg,#0b423a 0%,#147c68 58%,#216f91 100%); color:white; isolation:isolate; box-shadow:0 5px 18px #0b423a20; }
    .promo-slide { position:absolute; inset:0; display:flex; align-items:center; overflow:hidden; opacity:0; visibility:hidden; transform:translateX(18px) scale(.99); pointer-events:none; transition:opacity .7s ease, transform .85s cubic-bezier(.22,1,.36,1), visibility 0s linear .85s; }
    .promo-slide.is-active { opacity:1; visibility:visible; transform:translateX(0) scale(1); pointer-events:auto; z-index:1; transition-delay:0s; }
    .promo-copy { position:relative; z-index:2; width:56%; padding:34px 42px; }
    .promo-kicker { display:inline-flex; align-items:center; gap:7px; color:#d4f6e9; font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; margin-bottom:12px; }
    .promo-kicker::before { content:""; width:7px; height:7px; border-radius:50%; background:#a4f2c9; }
    .promo-copy h1 { margin:0 0 10px; max-width:490px; font-size:clamp(23px,3.2vw,38px); line-height:1.12; letter-spacing:-.6px; }
    .promo-copy p { margin:0; max-width:440px; color:#e1f4ed; font-size:15px; line-height:1.55; }
    .promo-link { display:inline-flex; margin-top:19px; padding:10px 16px; border-radius:22px; background:#fff; color:#12614f; text-decoration:none; font-size:13px; font-weight:700; transition:transform .18s, background .18s; }
    .promo-link:hover { transform:translateY(-2px); background:#edfff7; }
    .promo-art { position:absolute; z-index:0; inset:0 0 0 36%; width:64%; height:100%; object-fit:cover; object-position:center; cursor:pointer; }
    .promo-shade { position:absolute; z-index:1; inset:0; background:linear-gradient(90deg,#0b423a 0%,#0b423a 33%,rgba(11,66,58,.88) 48%,rgba(11,66,58,.08) 100%); }
    .promo-dots { position:absolute; z-index:4; left:50%; bottom:13px; transform:translateX(-50%); display:flex; align-items:center; gap:8px; }
    .promo-dot { width:8px; height:8px; padding:0; border:0; border-radius:10px; background:#ffffff8a; cursor:pointer; transition:width .2s,background .2s; }
    .promo-dot[aria-current="true"] { width:22px; background:#fff; }
    @media (max-width:600px) {
      .promo-carousel { margin-top:16px; padding:0 14px; }
      .promo-frame { min-height:280px; border-radius:18px; }
      .promo-copy { width:76%; padding:27px 22px 42px; }
      .promo-copy h1 { font-size:26px; max-width:275px; }
      .promo-copy p { max-width:265px; font-size:13px; }
      .promo-link { margin-top:15px; font-size:12px; padding:9px 14px; }
      .promo-art { left:24%; width:76%; object-position:60% center; opacity:.78; }
      .promo-shade { background:linear-gradient(90deg,#0b423a 0%,rgba(11,66,58,.96) 35%,rgba(11,66,58,.72) 67%,rgba(11,66,58,.22) 100%); }
    }
    @media (prefers-reduced-motion:reduce) { .promo-link,.promo-dot,.promo-slide { transition:none; } }

    @media (max-width:520px) {
      .topbar { padding:0 15px; gap:10px; }
      .brand { font-size:18px; }
      .search { width:42px; margin-left:auto; padding:0; justify-content:center; background:transparent; }
      .search input { display:none; }
      .categories { padding:0 16px; gap:24px; }
      .blank-area { padding:16px; }
      .bottom-nav { height:64px; }
    }
  </style>
</head>
